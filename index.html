<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LPM Live Demo</title>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4ead8;color:#2f1d12;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{max-width:820px;margin:24px;padding:40px;border:5px solid #4b2e1f;border-radius:22px;background:#fffaf2;box-shadow:0 10px 30px rgba(0,0,0,.12);text-align:center}
    h1{font-size:clamp(2rem,5vw,3.5rem);margin:.2em 0;color:#4b2e1f}
    p{font-size:clamp(1.1rem,2.5vw,1.45rem);line-height:1.5;margin:1em 0}
    .badge{display:inline-block;background:#8b6b2e;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:1rem;margin-bottom:18px}
    .cta{display:inline-block;margin-top:16px;padding:16px 24px;background:#4b2e1f;color:#fff;text-decoration:none;border-radius:14px;font-size:1.1rem;font-weight:700}
    .foot{margin-top:22px;font-size:1rem;color:#5f4a3f}
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Living Pages Ministry</div>
    <h1>LPM Live Demo</h1>
    <p>This is your starter live website.</p>
    <p>Once this file is uploaded to GitHub and connected to Vercel, you will have a working web address you can open from any device.</p>
    <a class="cta" href="#">Ready for the next feature</a>
    <div class="foot">Prepared for Timothy Gidman</div>
  </div>
</body>
</html>
