<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hear God's Heart Lesson Plan v1</title>
<style>*{box-sizing:border-box}body{margin:0;padding:16px 10px 40px;background:radial-gradient(ellipse at 50% 0,#4a2411 0,#1e0e06 70%);background-attachment:fixed;font:17px/1.45 system-ui,sans-serif;color:#2a1706}
.c{max-width:560px;margin:0 auto;background:#fff7dc;border:6px solid #d9b25a;border-radius:16px;padding:16px}h1{font:400 26px Georgia,serif;margin:0 0 4px}h4{margin:14px 0 2px;font:800 13px system-ui;letter-spacing:.06em;color:#7a3f1b}p,li{margin:3px 0}.b{display:block;text-align:center;text-decoration:none;font:700 19px system-ui;padding:14px;border-radius:12px;background:#E3A72F;color:#2B1D00;border:2px solid #2B1D00;margin:12px 0}.ty{background:#e6f4e6;border:2px solid #1f7a3a;border-radius:10px;padding:10px;font-weight:600}small{color:#6b5a40}</style></head><body><div class="c" id="c"></div>
<script>var LS={"3": {"title": "Who You Are to Me", "theme": "Who I Am to God (identity & worth)", "god": "God sees each person, calls them by name, and says they are His. Worth comes from who made us, not from what we have done.", "obj": ["See that God sees and knows you by name", "Separate who you are from what you have done", "Hear Psalm 139:14 and Isaiah 43:1 as God's own words to you"], "open": "Father, we ask who we are. Speak over us what You say. Amen.", "q": ["When do you feel unseen?", "What does it mean that God called you by name?", "How is who you are different from what you have done?", "What is one thing God says about you that you need to hear today?"], "act": "Each person writes a name tag with their own name, then writes on the back one thing God says about them from today's verses. Share one with a partner.", "close": "Lord, we are Yours. Help us live as people You have called by name. Amen.", "scr": [["Psalm 139:14", "I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well."], ["Isaiah 43:1", "Fear not: for I have redeemed thee, I have called thee by thy name; thou art mine."], ["1 John 3:1", "Behold, what manner of love the Father hath bestowed upon us, that we should be called the sons of God."], ["Ephesians 2:10", "For we are his workmanship, created in Christ Jesus unto good works."]]}, "4": {"title": "A Father Who Runs", "theme": "A Father's Love", "god": "God is the Father who sees you while you are still far off, and runs. His love is not earned and is not taken back.", "obj": ["See God as a Father who runs to us", "Hear Luke 15:20 as God's heart toward the one who left", "Know that God's love fills what a human father could not"], "open": "Father, we come as children. Show us Your heart. Amen.", "q": ["What picture comes to mind when you hear the word Father?", "Why did the father in Luke 15 run?", "What does Abba, Father mean to you?", "Who needs to hear that God is a Father to them?"], "act": "Read Luke 15:11-24 aloud, each person taking a part. Then each says one word that describes the father in the story.", "close": "Father, thank You for running to us. We are Yours. Amen.", "scr": [["Psalm 103:13", "Like as a father pitieth his children, so the LORD pitieth them that fear him."], ["Luke 15:20", "But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him."], ["Romans 8:15", "Ye have received the Spirit of adoption, whereby we cry, Abba, Father."], ["Psalm 68:5", "A father of the fatherless... is God in his holy habitation."]]}, "5": {"title": "Near the Broken", "theme": "Broken, Wounded & Healing", "god": "God does not stand far from the broken. He comes near, and He binds up the wound Himself. Nothing He heals is wasted.", "obj": ["See that God is near to the broken-hearted", "Hear Psalm 147:3 as a promise of tender care", "Learn that brokenness is where beginning can happen"], "open": "Father, we bring our broken places to You. Come near. Amen.", "q": ["What is one broken place you carry?", "What does nigh mean in Psalm 34:18?", "Why would God not despise a broken heart?", "What would it look like to let God bind up one wound this week?"], "act": "Hand each person a small piece of a broken plate or paper torn in half. Quietly name what is broken, then tape or place the pieces together as a picture of God's binding up.", "close": "Lord, bind up what is broken in us. We trust Your healing. Amen.", "scr": [["Psalm 34:18", "The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit."], ["Psalm 147:3", "He healeth the broken in heart, and bindeth up their wounds."], ["Psalm 51:17", "The sacrifices of God are a broken spirit: a broken and a contrite heart, O God, thou wilt not despise."], ["Isaiah 53:5", "He was wounded for our transgressions... and with his stripes we are healed."]]}, "6": {"title": "Lay It on Me", "theme": "Letting Go & Surrender", "god": "God does not ask us to carry it. He asks us to lay it down on Him, because He cares and He is strong enough.", "obj": ["See that we carry what God asks us to hand over", "Hear 1 Peter 5:7 as an invitation, not a command to try harder", "Practice laying down one burden in prayer"], "open": "Father, we are tired of carrying it. We lay it down. Amen.", "q": ["What are you carrying right now that is too heavy?", "Why is it hard to let go?", "What does it mean that God cares for you?", "What will you lay down today?"], "act": "Give each person a stone. Name a burden silently, then place the stone in a basket at the front as an act of laying it down.", "close": "Lord, we leave it with You. We will rest. Amen.", "scr": [["1 Peter 5:7", "Casting all your care upon him; for he careth for you."], ["Matthew 11:28", "Come unto me, all ye that labour and are heavy laden, and I will give you rest."], ["Psalm 55:22", "Cast thy burden upon the LORD, and he shall sustain thee: he shall never suffer the righteous to be moved."], ["Hebrews 12:1", "Let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us."]]}, "8": {"title": "One Day at a Time", "theme": "Walking With God Day by Day", "god": "God walks with us a day at a time. He lights the next step, orders our steps, and asks us not to carry tomorrow today.", "obj": ["See that God lights one step at a time", "Hear Proverbs 3:5-6 as an invitation to lean on God", "Practice giving tomorrow to God"], "open": "Father, we walk with You today. Light our next step. Amen.", "q": ["Why does God light only the next step?", "What does it mean to lean not on your own understanding?", "What are you carrying from tomorrow today?", "What is one step for today?"], "act": "Each person draws one footprint on paper and writes one step for today inside it. Share one with a partner.", "close": "Lord, we will walk with You today and leave tomorrow with You. Amen.", "scr": [["Psalm 119:105", "Thy word is a lamp unto my feet, and a light unto my path."], ["Psalm 37:23", "The steps of a good man are ordered by the LORD: and he delighteth in his way."], ["Proverbs 3:5-6", "Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths."], ["Matthew 6:34", "Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof."]]}, "9": {"title": "Trust and Obey", "theme": "Trust, Obey & Wisdom", "god": "God gives wisdom freely to those who ask, and asks for obedience that grows from love, not fear.", "obj": ["See that obedience flows from love", "Hear James 1:5 as a promise of wisdom", "Ask God for wisdom for one decision"], "open": "Father, we ask for wisdom and a listening heart. Amen.", "q": ["Why does God give wisdom without scolding?", "What is the difference between obeying out of love and out of fear?", "Where do you need wisdom right now?", "What is one thing God has asked of you that you have put off?"], "act": "Write one decision you face on a card. Pray James 1:5 over it together, then place the card in a basket as a sign of asking.", "close": "Lord, give us wisdom and willing hearts. Amen.", "scr": [["Proverbs 9:10", "The fear of the LORD is the beginning of wisdom: and the knowledge of the holy is understanding."], ["James 1:5", "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."], ["John 14:15", "If ye love me, keep my commandments."], ["1 Samuel 15:22", "Behold, to obey is better than sacrifice, and to hearken than the fat of rams."]]}, "11": {"title": "What You Need", "theme": "God's Provision & Needs vs Wants", "god": "God knows what we need and supplies it. He asks us to seek Him first and to find contentment in what He gives.", "obj": ["Tell the difference between a need and a want", "Hear Philippians 4:19 as God's promise", "Practice seeking God first"], "open": "Father, we trust You to supply what we need. Amen.", "q": ["What is the difference between a need and a want?", "What does it mean that the Lord is your shepherd and you shall not want?", "What is one thing you are worried about supplying?", "How can you seek God first this week?"], "act": "List three needs and three wants. Pray over the needs together, thanking God for how He has supplied before.", "close": "Lord, we trust You to supply. Make us content. Amen.", "scr": [["Psalm 23:1", "The LORD is my shepherd; I shall not want."], ["Philippians 4:19", "But my God shall supply all your need according to his riches in glory by Christ Jesus."], ["Matthew 6:33", "But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."], ["1 Timothy 6:8", "And having food and raiment let us be therewith content."]]}, "12": {"title": "Fear Meets Faith", "theme": "Fear Meets Faith", "god": "Fear is real, and God does not shame us for it. He is already where we are afraid to go, and He gives power, love and a sound mind.", "obj": ["Name a fear and bring it to God", "Hear 2 Timothy 1:7 as God's gift", "Practice the prayer: when I am afraid, I will trust"], "open": "Father, we bring our fears. Meet us in them. Amen.", "q": ["What is one fear you carry?", "What does it mean that God is already there?", "What does a sound mind feel like?", "What will you do the next time fear shows up?"], "act": "Write a fear on a card, then write Psalm 56:3 on the back. Read it aloud to a partner.", "close": "Lord, when we are afraid, we will trust in You. Amen.", "scr": [["Joshua 1:9", "Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest."], ["2 Timothy 1:7", "For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind."], ["Psalm 56:3", "What time I am afraid, I will trust in thee."], ["Psalm 121:1-2", "I will lift up mine eyes unto the hills, from whence cometh my help. My help cometh from the LORD, which made heaven and earth."]]}, "14": {"title": "Paid in Full", "theme": "Salvation, Cross & Resurrection", "god": "God gave His Son out of love while we were still sinners. Salvation is a gift, paid in full, sealed by the empty tomb.", "obj": ["See that salvation is a gift, not earned", "Hear John 3:16 and Romans 5:8 as God's heart", "Rejoice in the empty tomb"], "open": "Father, thank You for the gift we could not earn. Amen.", "q": ["What does it mean that Christ died for us while we were yet sinners?", "Why can we not earn salvation?", "What does the empty tomb mean for you?", "Who could you share this gift with?"], "act": "Wrap a small box as a gift and place a card inside that says: It is the gift of God. Pass the gift around and read Ephesians 2:8-9 together.", "close": "Lord, we receive Your gift with thankful hearts. Amen.", "scr": [["John 3:16", "For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."], ["Romans 5:8", "But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us."], ["Ephesians 2:8-9", "For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: not of works, lest any man should boast."], ["Luke 24:6", "He is not here, but is risen."]]}, "15": {"title": "Anchor, Joy and Peace", "theme": "Hope, Joy & Peace", "god": "God gives hope that holds, joy that comes after the night, and peace that guards the heart beyond understanding.", "obj": ["See hope as an anchor that holds", "Hear Psalm 30:5 as a promise of morning", "Receive the peace that guards the heart"], "open": "Father, fill us with hope, joy and peace. Amen.", "q": ["What is your anchor in storms?", "Why does joy come in the morning?", "What does a peace that passes understanding feel like?", "Where do you need hope today?"], "act": "Draw an anchor. Around it write the names of people and promises you are holding to. Share one with a partner.", "close": "Lord, fill us with joy and peace as we believe. Amen.", "scr": [["Hebrews 6:19", "Which hope we have as an anchor of the soul, both sure and stedfast."], ["Psalm 30:5", "Weeping may endure for a night, but joy cometh in the morning."], ["Philippians 4:7", "And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus."], ["Romans 15:13", "Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost."]]}, "17": {"title": "A Way Out", "theme": "Habits, Waste & Temptation", "god": "God does not shame the one who is caught in a habit. He is faithful, provides a way out, and offers what truly satisfies.", "obj": ["See that God provides a way out of temptation", "Hear Isaiah 55:2 as an invitation to what satisfies", "Name one habit and one step toward freedom"], "open": "Father, we bring our habits to You. Make a way out. Amen.", "q": ["What habit keeps pulling you back?", "What does it mean that God is faithful in temptation?", "What have you spent yourself on that did not satisfy?", "What is the next step toward freedom?"], "act": "Write one habit on a slip. Pray over it, then write on the back one trusted person you will tell this week.", "close": "Lord, set us free and keep us standing in Your liberty. Amen.", "scr": [["1 Corinthians 10:13", "There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it."], ["Isaiah 55:2", "Wherefore do ye spend money for that which is not bread? and your labour for that which satisfieth not?"], ["Romans 6:14", "For sin shall not have dominion over you: for ye are not under the law, but under grace."], ["Galatians 5:1", "Stand fast therefore in the liberty wherewith Christ hath made us free, and be not entangled again with the yoke of bondage."]]}, "24": {"title": "Still Here in the Dark", "theme": "Faith in the Storm", "god": "God hears the question 'have You forgotten me?' and answers: I am still here. He calms the storm and holds a light on the horizon.", "obj": ["See that God is not offended by honest questions", "Hear Isaiah 41:10 as His promise in the storm", "Look for the light on the horizon"], "open": "Father, we cry out from the storm. Be near. Amen.", "q": ["When have you asked God if He forgot you?", "What does it mean that He is still here in the dark?", "What shakes your faith?", "What light on the horizon can you see?"], "act": "Light a candle or a small light in a dark room. Read Psalm 107:28-29 together, and say aloud: You are still here.", "close": "Lord, steady our faith and light our way. Amen.", "scr": [["Psalm 13:1", "How long wilt thou forget me, O LORD? for ever? how long wilt thou hide thy face from me?"], ["Psalm 107:28-29", "Then they cry unto the LORD in their trouble, and he bringeth them out of their distresses. He maketh the storm a calm."], ["Jeremiah 29:11", "For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end."], ["Isaiah 41:10", "Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee."]]}, "25": {"title": "By His Stripes", "theme": "Healing & Release", "god": "God is close to the brokenhearted. He saw every broken piece, bound the wounds, and carries what we can no longer hold.", "obj": ["See that God is near in grief and pain", "Hear Isaiah 53:5 as healing already paid for", "Open your hands and let go"], "open": "Father, heal what is broken in us. We open our hands. Amen.", "q": ["What broken piece do you carry?", "What does it mean that God is near to the brokenhearted?", "What have you held on to for too long?", "What would open hands look like for you?"], "act": "Hold a closed fist. Name one burden, then slowly open your hand and say: I give it to You. Pray for each other.", "close": "Lord, bind our wounds and make us whole. Amen.", "scr": [["Psalm 34:18", "The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit."], ["Isaiah 53:5", "But he was wounded for our transgressions, he was bruised for our iniquities: and with his stripes we are healed."], ["Psalm 147:3", "He healeth the broken in heart, and bindeth up their wounds."], ["Psalm 55:22", "Cast thy burden upon the LORD, and he shall sustain thee."]]}, "26": {"title": "Teach Me, Draw Me Closer", "theme": "Drawing Near & Learning", "god": "God invites a teachable heart. When we draw near in the quiet, He draws near and shows us His ways.", "obj": ["See that God delights to teach and to draw near", "Hear James 4:8 as a promise", "Make room for quiet with God today"], "open": "Father, quiet our hearts so we can hear You. Amen.", "q": ["Why do we find it hard to be still?", "What does it mean to ask God to teach you?", "What distracts you from drawing near?", "When will you set aside quiet time this week?"], "act": "Sit in silence for two minutes, then each person shares one thing they sensed God say. Close by reading Psalm 46:10.", "close": "Lord, teach us, and draw us closer to You. Amen.", "scr": [["Psalm 25:4-5", "Shew me thy ways, O LORD; teach me thy paths. Lead me in thy truth, and teach me."], ["James 4:8", "Draw nigh to God, and he will draw nigh to you."], ["Psalm 46:10", "Be still, and know that I am God."], ["Proverbs 3:5-6", "Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths."]]}};function esc(x){return String(x).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
var n=(location.search.match(/[?&]n=(\d+)/)||[])[1],d=LS[+n],c=document.getElementById("c");
if(!d){c.innerHTML="<h1>Lesson plan</h1><p>We could not find that lesson. Please go back to the music page.</p>"}else{
c.innerHTML='<div class="ty">Thank you for your gift to Living Pages Ministry. Here is your lesson plan.</div><h1>Lesson: '+esc(d.title)+'</h1><p><i>'+esc(d.theme)+'</i></p><a class="b" href="../hgh/lesson/'+("0"+n).slice(-2)+'.pdf">Open the PDF lesson plan</a><h4>GOD IS SAYING</h4><p>'+esc(d.god)+'</p><h4>OBJECTIVES</h4><ul>'+d.obj.map(function(o){return"<li>"+esc(o)+"</li>"}).join("")+'</ul><h4>SCRIPTURE</h4>'+d.scr.map(function(s){return"<p><b>"+esc(s[0])+"</b> "+esc(s[1])+"</p>"}).join("")+'<h4>OPENING PRAYER</h4><p>'+esc(d.open)+'</p><h4>DISCUSSION</h4><ul>'+d.q.map(function(o){return"<li>"+esc(o)+"</li>"}).join("")+'</ul><h4>ACTIVITY</h4><p>'+esc(d.act)+'</p><h4>CLOSING PRAYER</h4><p>'+esc(d.close)+'</p><p><small>Living Pages Ministry</small></p>'}
</script></body></html>
