function lyrSync(){if(cur<0)return;var r=rows[cur],q=r.ly;if(!q||q.hidden||!r.tl)return;var t=A.currentTime,k=-1;for(var j=0;j<r.tl.length;j++){if(r.tl[j].t<=t+0.3)k=j;else break}
  if(k===r.k)return;r.k=k;var els=q.querySelectorAll(".ll[data-t]");for(var e=0;e<els.length;e++)els[e].className=(+els[e].dataset.i===k)?"ll now":"ll";
  var el=k>=0?q.querySelector('.ll[data-i="'+k+'"]'):null;if(el)q.scrollTop=el.offsetTop-q.clientHeight/2+el.offsetHeight/2}

function start(d){
  DATA=d;$("album").textContent=d.album;var ol=$("songs");ol.textContent="";rows=[];
  d.songs.forEach(function(s,i){
    var li=document.createElement("li"),b=document.createElement("button");b.type="button";b.className="song";

    var m=document.createElement("div");m.className="mini";
    var pp=document.createElement("button");pp.type="button";pp.className="pp";pp.textContent="Pause";pp.onclick=function(){if(A.paused)tryPlay();else A.pause()};
    var rg=document.createElement("input");rg.type="range";rg.min=0;rg.max=1;rg.step="any";rg.value=0;rg.oninput=function(){if(i===cur&&A.duration)A.currentTime=+rg.value};
    var tm=document.createElement("span");tm.className="tm";tm.textContent="0:00";
    m.appendChild(pp);m.appendChild(rg);m.appendChild(tm);
    var row=document.createElement("div");row.className="row";row.appendChild(b);
    var y=document.createElement("button");y.type="button";y.className="yes";y.textContent="Yes";y.setAttribute("aria-label","Add "+s.title+" to my list");
    y.onclick=function(){if(sel[i]){delete sel[i];y.className="yes";y.textContent="Yes"}else{sel[i]=true;y.className="yes on";y.textContent="\u2713 Yes"}updGo()};
    var side=document.createElement("div");side.className="side";side.appendChild(y);
    var lb=document.createElement("button");lb.type="button";lb.className="lbtn";lb.textContent="Lyrics";
    var ly=document.createElement("div");ly.className="lyr";ly.hidden=true;var loaded=false;
    var R={};
    function show(){ly.hidden=false;lb.className="lbtn on";if(loaded)return;loaded=true;ly.textContent="Loading lyrics\u2026";
      var base=String(s.file||"").replace(/^.*\//,"").replace(/\.mp3$/i,"");
      fetch("lyrics/"+encodeURIComponent(base)+".txt?v="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
        t=t.trim();if(!t){ly.textContent="Lyrics for this song are coming soon.";return}
        ly.textContent="";var tl=[],ix=0;t.split("\n").forEach(function(l){var d=document.createElement("div");d.className="ll";var m=l.match(/^\[(\d+):(\d\d(?:\.\d)?)\]\s*(.*)$/);
          if(m){d.textContent=m[3];d.dataset.t=1;d.dataset.i=ix;tl.push({t:(+m[1])*60+parseFloat(m[2])});ix++}else{d.textContent=l||"\u00a0"}ly.appendChild(d)});
        if(tl.length){rows[i].tl=tl;rows[i].k=-2;lyrSync()}}).catch(function(){ly.textContent="Lyrics for this song are coming soon."})}
    lb.onclick=function(){if(!ly.hidden){ly.hidden=true;lb.className="lbtn";return}show()};
    side.appendChild(lb);row.appendChild(side);li.appendChild(row);li.appendChild(ly);li.appendChild(m);ol.appendChild(li);
    rows.push({li:li,pp:pp,rg:rg,tm:tm,yes:y,ly:ly,show:show,lb:lb})});
}

function titleOf(n){var t=n.replace(/\.mp3$/i,"").replace(/_+/g," ").replace(/^\d+[\s.\-]+/,"").trim();return t||n.replace(/\.mp3$/i,"")}
